name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        preset: [release, asan-ubsan]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - run: bash scripts/ci_run.sh cmake --build --preset ${{ matrix.preset }} -- -k 0
      - run: bash scripts/ci_run.sh ctest --preset ${{ matrix.preset }}

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset tsan
      - run: bash scripts/ci_run.sh cmake --build --preset tsan -- -k 0
      - run: bash scripts/ci_run.sh ctest --preset tsan

  cxx20:
    # The Unreal plugin compiles core/format as C++20, so it must build that way too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset release -DCMAKE_CXX_STANDARD=20
      - run: bash scripts/ci_run.sh cmake --build --preset release -- -k 0

  determinism:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset release
      - run: bash scripts/ci_run.sh cmake --build --preset release -- -k 0
      - name: Record on one thread, verify on eight
        run: |
          sim=./build/release/apps/swarm_sim
          flags="--seed 42 --agents 16 --ticks 500 --loss-model burst --loss 0.2 --mean-burst 4"
          flags="$flags --latency 2 --jitter 2 --rate-limit 3"
          $sim --record run.log $flags --threads 1
          $sim --replay run.log --verify --threads 8
      - name: Same output for every thread count
        run: |
          sim=./build/release/apps/swarm_sim
          for t in 1 2 4 8; do
            $sim --seed 42 --agents 16 --ticks 500 --loss-model independent --loss 0.3 \
              --threads $t > out_$t.txt
          done
          diff out_1.txt out_2.txt
          diff out_1.txt out_4.txt
          diff out_1.txt out_8.txt

      - name: Run every scenario, verify its log on eight threads
        run: |
          sim=./build/release/apps/swarm_sim
          for f in scenarios/*.yaml; do
            echo "$f"
            $sim run "$f" --out scenario.swlog --threads 1
            $sim --replay scenario.swlog --verify --threads 8
          done

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_core_invariants.sh
      - run: pip install clang-format==23.1.3
      - run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run -Werror

  analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -r analysis/requirements.txt
      - run: python -m pytest -q
        working-directory: analysis
