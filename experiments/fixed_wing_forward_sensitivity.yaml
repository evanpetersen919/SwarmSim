# How much the forward sensor result depends on two assumed parameters of the sensor, its range and
# its dropout probability (ADR 0013): 3 ranges x 3 dropout levels x 4 maps = 36 cells, forward sensor
# only, clear air, on base_fixed_wing_forward.yaml. Run with 30 seeds, 1,080 runs. The maps are the
# ones of fixed_wing_forward.yaml that put aircraft on the ground without a sensor, and the exact
# map as the control. A result of the main experiment holds across the assumptions if it holds in
# every cell here.
version: 1
name: fixed_wing_forward_sensitivity
base: base_fixed_wing_forward.yaml
seeds: {first: 1, count: 5}
axes:
  - name: range
    levels:
      - {label: r400, set: {sensors: {forward: {max_range_m: 400, period_ticks: 5}}}}
      - {label: r800, set: {sensors: {forward: {max_range_m: 800, period_ticks: 5}}}}
      - {label: r1500, set: {sensors: {forward: {max_range_m: 1500, period_ticks: 5}}}}
  - name: dropout
    levels:
      - {label: d05, set: {sensors: {forward: {dropout_probability: 0.05}}}}
      - {label: d25, set: {sensors: {forward: {dropout_probability: 0.25}}}}
      - {label: d50, set: {sensors: {forward: {dropout_probability: 0.5}}}}
  - name: map
    levels:
      - {label: exact, set: {}}
      - {label: offset60, set: {control: {terrain: {offset_m: -60}}}}
      - {label: offset80, set: {control: {terrain: {offset_m: -80}}}}
      - label: omit
        set:
          control:
            terrain:
              omit:
                - {x_m: [-250, 250], y_m: [-250, 250]}
