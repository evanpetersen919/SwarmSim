# How much the avoidance result depends on the two assumed numbers of the rule, the horizon and the
# share of the vehicle's sideways acceleration a turn may use (ADR 0014): 3 horizons x 2 bank
# fractions x 2 maps = 12 cells, avoidance on with the forward sensor, clear air, hills of 400 m, on
# base_fixed_wing_avoid.yaml. Run with 30 seeds, 360 runs. A result of the main experiment holds
# across the assumptions if it holds in every cell here.
version: 1
name: fixed_wing_avoid_sensitivity
base: base_fixed_wing_avoid.yaml
seeds: {first: 1, count: 5}
axes:
  - name: horizon
    levels:
      - {label: h6, set: {scene: {amplitude_m: 400}, sensors: {forward: {period_ticks: 5}}, control: {avoid: {horizon_s: 6}}}}
      - {label: h12, set: {scene: {amplitude_m: 400}, sensors: {forward: {period_ticks: 5}}, control: {avoid: {horizon_s: 12}}}}
      - {label: h20, set: {scene: {amplitude_m: 400}, sensors: {forward: {period_ticks: 5}}, control: {avoid: {horizon_s: 20}}}}
  - name: bank
    levels:
      - {label: b50, set: {control: {avoid: {bank_fraction: 0.5}}}}
      - {label: b90, set: {control: {avoid: {bank_fraction: 0.9}}}}
  - name: map
    levels:
      - {label: none, set: {}}
      - {label: offset60, set: {control: {terrain: {clearance_m: 60, offset_m: -60}}}}
