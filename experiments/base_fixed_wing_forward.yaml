# The scenario of the forward obstacle sensor experiment (ADR 0013), on the current model (scenario
# version 3): the dense fixed-wing base with the mission altitude lowered to 20 m, below the 60 m
# clearance, so that the altitude the aircraft fly is set by the terrain floor and so by the prior
# map. At the 100 m of the dense base the hills near the orbit are low enough that the map never
# decides anything, and a wrong map changes nothing (found by experiments/probe_fixed_wing_map_errors.yaml).
# Twelve ALTIUS-class aircraft on one 80 m orbit over 120 m hills, energy model, a steady wind with
# gusts, ground contact that ends a flight, terrain guidance. The axes replace parts of it; its seed
# is ignored.
version: 3
name: fixed_wing_forward_base
seed: 1
dt: 0.02
duration_s: 90

scene:
  type: hills
  size_m: [2000, 2000]
  cell_m: 10
  amplitude_m: 120
  obstacles:
    density_per_m2: 0.0

swarm:
  drones: 12

mission:
  waypoints:
    - [0, 0, 20]
  speed_mps: 17

vehicle:
  type: fixed_wing
  dynamics: energy

environment:
  wind: {mean_mps: [3, -2], gust_mps: 1.5, gust_scale_m: 150}
  ground_contact_crashes: true

weather: {visibility_m: 20000, rain_mm_h: 0}

comms:
  latency_ticks: 2
  jitter_ticks: 1
  loss_model: independent
  loss: 0.0
  jammers: []

control:
  predictor: kalman
  report_period_ticks: 5
  staleness_ticks: 50
  orbit:
    radius_m: 80
    radius_step_m: 0
    altitude_step_m: 0
    safe_distance_m: 25
  terrain:
    clearance_m: 60

faults: []

metrics:
  settle_s: 20
  collision_radius_m: 10.0
  recovery_threshold_m: 40.0
  recovery_hold_s: 5.0
