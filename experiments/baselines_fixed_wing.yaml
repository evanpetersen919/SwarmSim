# Four neighbor predictors against three ways of fixing the phase: 4 predictors x 3 consensus
# weights x 3 jamming x 2 loss = 72 cells, five seeds. The weights are 0 (the shared clock alone),
# 0.5 (clock and neighbors), and 1 (the neighbors alone, no clock). Only the neighbors-alone
# aircraft depend on what they hear, so that is where the predictors can separate.
version: 1
name: baselines_fixed_wing
base: base_fixed_wing.yaml
seeds: {first: 1, count: 5}
axes:
  - name: predictor
    levels:
      - {label: kalman, set: {control: {predictor: kalman}}}
      - {label: turning, set: {control: {predictor: turning}}}
      - {label: dead_reckoning, set: {control: {predictor: dead_reckoning}}}
      - {label: hold_last, set: {control: {predictor: hold_last}}}
  - name: consensus
    levels:
      - {label: clock, set: {control: {orbit: {consensus_weight: 0.0}}}}
      - {label: blend, set: {control: {orbit: {consensus_weight: 0.5}}}}
      - {label: peers, set: {control: {orbit: {consensus_weight: 1.0}}}}
  - name: jamming
    levels:
      - {label: none, set: {comms: {jammers: []}}}
      - label: constant
        set:
          comms:
            jammers:
              - {center: [0, 0, 100], radius_m: 600, mode: constant, from_s: 30, to_s: 90, loss: 0.95, affects: receiver}
      - label: pulsed
        set:
          comms:
            jammers:
              - {center: [0, 0, 100], radius_m: 600, mode: pulsed, from_s: 30, to_s: 90, period_ticks: 100, duty: 0.5, loss: 0.95, affects: receiver}
  - name: loss
    levels:
      - {label: p00, set: {comms: {loss_model: independent, loss: 0.0}}}
      - {label: p50, set: {comms: {loss_model: independent, loss: 0.5}}}
