# The stale-neighbor rule on the baselines of baselines.yaml: with `keep` every neighbor with an estimate
# stays in the formation consensus however long it has been silent, and with `drop100` a neighbor
# not heard from for more than 100 ticks (2 s, 20 report periods) is left out of it.
# The only threshold tried, fixed before the run. 4 predictors x 3 loss levels x 2 jamming x
# 2 faults x 2 rule levels = 96 cells. Compare with `paired_difference` on the stale_rule axis.
version: 1
name: baselines_drop
base: base.yaml
seeds: {first: 1, count: 5}
axes:
  - name: predictor
    levels:
      - {label: hold_last, set: {control: {predictor: hold_last}}}
      - {label: dead_reckoning, set: {control: {predictor: dead_reckoning}}}
      - {label: kalman, set: {control: {predictor: kalman}}}
      - {label: oracle, set: {control: {predictor: oracle}}}
  - name: loss
    levels:
      - {label: p10, set: {comms: {loss_model: independent, loss: 0.1}}}
      - {label: p30, set: {comms: {loss_model: independent, loss: 0.3}}}
      - {label: p50, set: {comms: {loss_model: independent, loss: 0.5}}}
  - name: jamming
    levels:
      - {label: none, set: {comms: {jammers: []}}}
      - label: pulsed
        set:
          comms:
            jammers:
              - {center: [0, 0, 20], radius_m: 150, mode: pulsed, from_s: 20, to_s: 40, period_ticks: 100, duty: 0.5, loss: 0.9, affects: receiver}
  - name: faults
    levels:
      - {label: none, set: {faults: []}}
      - {label: one, set: {faults: [{drone: 2, at_s: 30}]}}
  - name: stale_rule
    levels:
      - {label: keep, set: {control: {drop_stale_after_ticks: 0}}}
      - {label: drop100, set: {control: {drop_stale_after_ticks: 100}}}
