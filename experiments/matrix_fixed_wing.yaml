# The fixed-wing matrix: 4 weather x 3 jamming x 3 loss x 3 drone counts x 2 faults = 216 cells.
# Five seeds per cell is 1,080 runs. The seed count is the one value to change for the final run.
# The controller is the default one (Kalman prediction, blended phase consensus, stacked altitudes);
# baselines_fixed_wing.yaml and ablation_fixed_wing.yaml vary the controller.
version: 1
name: matrix_fixed_wing
base: base_fixed_wing.yaml
seeds: {first: 1, count: 5}
axes:
  - name: weather
    levels:
      - {label: clear, set: {weather: {visibility_m: 20000, rain_mm_h: 0}}}
      - {label: haze, set: {weather: {visibility_m: 1000, rain_mm_h: 0}}}
      - {label: fog, set: {weather: {visibility_m: 350, rain_mm_h: 0}}}
      - {label: blind, set: {weather: {visibility_m: 200, rain_mm_h: 0}}}
  - name: jamming
    levels:
      - {label: none, set: {comms: {jammers: []}}}
      - label: constant
        set:
          comms:
            jammers:
              - {center: [0, 0, 100], radius_m: 600, mode: constant, from_s: 30, to_s: 90, loss: 0.95, affects: receiver}
      - label: pulsed
        set:
          comms:
            jammers:
              - {center: [0, 0, 100], radius_m: 600, mode: pulsed, from_s: 30, to_s: 90, period_ticks: 100, duty: 0.5, loss: 0.95, affects: receiver}
  - name: loss
    levels:
      - {label: p00, set: {comms: {loss_model: independent, loss: 0.0}}}
      - {label: p30, set: {comms: {loss_model: independent, loss: 0.3}}}
      - {label: p50, set: {comms: {loss_model: independent, loss: 0.5}}}
  - name: size
    levels:
      - {label: n06, set: {swarm: {drones: 6, start: {columns: 3}}}}
      - {label: n10, set: {swarm: {drones: 10, start: {columns: 4}}}}
      - {label: n16, set: {swarm: {drones: 16, start: {columns: 4}}}}
  - name: faults
    levels:
      - {label: none, set: {faults: []}}
      - {label: one, set: {faults: [{drone: 2, at_s: 60}]}}
