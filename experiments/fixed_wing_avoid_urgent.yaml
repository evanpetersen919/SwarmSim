# The urgent-turn experiment (ADR 0017): does turning with the whole bank and slowing, when the time
# to a threat is short, keep more aircraft off the ground, and what does it cost? 2 weather levels x
# 3 steepness levels x 2 maps x 4 arms = 48 cells. Run with 30 seeds, 1,440 runs, on
# base_fixed_wing_avoid.yaml. Compare arms with `paired_difference` on the arm axis, within each
# weather, steepness, and map level.
#
# The criteria U1 to U5 were written in ADR 0017 before this file was run. They apply to the arm
# urgent6 against all3; urgent4 and urgent8 are reported and are not part of the criteria.
#
# weather:   clear air, and fog of 375 m visibility.
# amplitude: hills of 40 (a gentle control), 400, and 480 m.
# map:       none (no terrain guidance; the aircraft fly at 100 m and only a sensor can react), and
#            exact (terrain guidance from an exact map, where every trigger is a false alarm).
# arm:       all3 (avoidance with the three changes of ADR 0015: rejoin, kinematic feasibility, a
#            clearance of 30 m); urgent4, urgent6, and urgent8 (the same with urgent_s of 4, 6, and
#            8 s).
version: 1
name: fixed_wing_avoid_urgent
base: base_fixed_wing_avoid.yaml
seeds: {first: 1, count: 5}
axes:
  - name: weather
    levels:
      - {label: clear, set: {weather: {visibility_m: 20000, rain_mm_h: 0}}}
      - {label: fog, set: {weather: {visibility_m: 375, rain_mm_h: 0}}}
  - name: amplitude
    levels:
      - {label: a40, set: {scene: {amplitude_m: 40}}}
      - {label: a400, set: {scene: {amplitude_m: 400}}}
      - {label: a480, set: {scene: {amplitude_m: 480}}}
  - name: map
    levels:
      - {label: none, set: {}}
      - {label: exact, set: {control: {terrain: {clearance_m: 60}}}}
  - name: arm
    levels:
      - {label: all3, set: {sensors: {forward: {period_ticks: 5}}, control: {avoid: {horizon_s: 12, rejoin: true, feasibility: kinematic, clearance_m: 30}}}}
      - {label: urgent4, set: {sensors: {forward: {period_ticks: 5}}, control: {avoid: {horizon_s: 12, rejoin: true, feasibility: kinematic, clearance_m: 30, urgent_s: 4}}}}
      - {label: urgent6, set: {sensors: {forward: {period_ticks: 5}}, control: {avoid: {horizon_s: 12, rejoin: true, feasibility: kinematic, clearance_m: 30, urgent_s: 6}}}}
      - {label: urgent8, set: {sensors: {forward: {period_ticks: 5}}, control: {avoid: {horizon_s: 12, rejoin: true, feasibility: kinematic, clearance_m: 30, urgent_s: 8}}}}
